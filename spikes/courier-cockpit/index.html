<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Courier · Cockpit study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#03070a;color:#b6cbd0;font:12px ui-monospace,SFMono-Regular,monospace;overflow:hidden}canvas{display:block}header{position:fixed;top:22px;left:26px;pointer-events:none;text-shadow:0 2px 6px #000}h1{font-size:15px;letter-spacing:.2em;color:#efd391;margin:0 0 6px}header p{margin:0;line-height:1.6;color:#94adb8}.toolbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px;background:#071015de;border:1px solid #33444d;border-radius:5px;backdrop-filter:blur(8px);white-space:nowrap}button,a{font:inherit;color:#bfd2d6;background:#152129;border:1px solid #3e5058;border-radius:3px;padding:10px 12px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#26383e;color:#ffe2a0}button[aria-pressed=true]{border-color:#c5a56a;color:#ffdda1;background:#2b2a22}#readout{position:fixed;right:22px;top:22px;font-size:11px;color:#95a8ac;line-height:1.8;text-align:right}#loading{position:fixed;top:48%;width:100%;text-align:center;color:#efd391}#hint{position:fixed;left:25px;bottom:28px;font-size:11px;color:#a9b5b7;max-width:220px}#target-dialog{position:fixed;inset:0;z-index:4;background:#000e;display:grid;place-items:center}#target-dialog[hidden]{display:none}#target-dialog img{max-width:95vw;max-height:90vh}#target-dialog button{position:absolute;top:15px;right:20px}.capture header,.capture .toolbar,.capture #readout,.capture #hint{display:none}@media(max-width:1000px){.toolbar{bottom:12px;max-width:97vw;overflow:auto}button,a{padding:9px 8px}#hint{bottom:66px;font-size:10px}header{top:14px;left:14px}#readout{top:14px;right:14px}}
</style></head><body>
<header><h1>COURIER / INDUSTRIAL REFIT</h1><p>O9 architecture · O8 equipment<br>Interactive model study · instrument values are a fixture</p></header>
<div id="readout"></div><div id="loading">Loading cockpit…</div>
<div id="hint">Drag to look · Wheel to inspect<br>P resets pilot view · H hides controls</div>
<nav class="toolbar" aria-label="Cockpit viewer controls">
<button data-view="pilot" aria-pressed="true">Pilot</button><button data-view="orbit">Orbit</button><button data-view="instruments">Instruments</button><button data-view="side">Side</button><button id="fit" aria-pressed="false">Hull fit</button><button id="lights" aria-pressed="false">Work lights</button><button id="target">Target</button><button id="capture">Save image</button>
</nav>
<div id="target-dialog" hidden><img src="/spikes/courier-cockpit/target.png" alt="Selected target: O9 low courier cockpit with O8 equipment"><button id="close-target">Close · Esc</button></div>
<script type="module" src="/src/courier-cockpit-viewer.ts"></script></body></html>
