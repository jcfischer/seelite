<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station comparison · Codex</title><style>*{box-sizing:border-box}body{background:#0b0d0f;color:#dde2e4;font:15px/1.5 system-ui;margin:0}main{max-width:1600px;margin:auto;padding:30px}h1{font-weight:400}a{color:#ddb77f}article{border-top:1px solid #384047;padding:18px 0;margin-top:24px}h2{font-size:21px}figure{margin:0}img{width:100%;display:block}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figcaption{color:#a2aeb4;padding:7px 0}.score{font-size:15px;color:#ddb77f}nav{display:flex;flex-wrap:wrap;gap:16px}@media(max-width:650px){.pair{grid-template-columns:1fr}main{padding:15px}}</style><main><h1>Nine stations · target and model</h1><p>Six stations meet 7/10. Drum, Buoy and Salvage remain at 6.9; awaiting your visual input after the loop stalled. Approved images beside hardware-browser captures. <a href="./">Open the interactive viewer</a>.</p><nav></nav><div id="content">Loading review evidence…</div></main><script type="module">
const data=await fetch('./evidence/results.json').then(r=>{if(!r.ok)throw Error('Review evidence is not final yet');return r.json()});
document.querySelector('nav').innerHTML=data.models.map((m,i)=>`<a href="#${m.name}">O${i+1} ${m.name}</a>`).join('');
document.querySelector('#content').innerHTML=data.models.map((m,i)=>`<article id="${m.name}"><h2>O${i+1} · ${m.name[0].toUpperCase()+m.name.slice(1)} <span class="score">${m.score.toFixed(2)}/10</span></h2><div class="pair"><figure><a href="target-${m.name}.png"><img src="target-${m.name}.png" alt="Approved ${m.name} target"></a><figcaption>Approved target</figcaption></figure><figure><a href="evidence/${m.name}-hero.png"><img src="evidence/${m.name}-hero.png" alt="Rendered ${m.name} model"></a><figcaption>Rendered model · <a href="./?model=${m.name}">orbit this station</a></figcaption></figure></div></article>`).join('');
</script></html>
