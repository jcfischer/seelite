<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Far Between — A browser spaceflight game</title>
    <style>
      /* Inline and small on purpose: a canvas and two layers over it, and a
         stylesheet for that would be a file to keep in sync with nothing. The
         one line of text it also styled was the key legend, which #381 S5
         deleted - the Controls tab is the reference. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      /* The marker overlay sits on the glass, over the WebGL canvas and under
         nothing — it never takes a click, so pointer lock still belongs to the
         renderer's canvas beneath it. */
      #overlay {
        position: fixed;
        left: 0;
        top: 0;
        /* Explicit, not `inset: 0`. A canvas is a replaced element, so with
           `width: auto` it takes its intrinsic size — the 300x150 default — and
           the `right`/`bottom` insets are simply dropped as over-constrained.
           The markers then draw into a small box in the corner, which is exactly
           what the first version of this did. */
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #hud {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        pointer-events: none;
      }
    </style>
  </head>
  <body data-public-page="">
    <canvas id="overlay"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
