<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seelite</title>
    <style>
      /* Inline and small on purpose. There is one canvas and one line of text;
         a stylesheet for that would be a file to keep in sync with nothing. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      /* The marker overlay sits on the glass, over the WebGL canvas and under
         nothing — it never takes a click, so pointer lock still belongs to the
         renderer's canvas beneath it. */
      #overlay {
        position: fixed;
        left: 0;
        top: 0;
        /* Explicit, not `inset: 0`. A canvas is a replaced element, so with
           `width: auto` it takes its intrinsic size — the 300x150 default — and
           the `right`/`bottom` insets are simply dropped as over-constrained.
           The markers then draw into a small box in the corner, which is exactly
           what the first version of this did. */
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #hud {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        pointer-events: none;
      }
      #keys {
        position: fixed;
        right: 12px;
        bottom: 10px;
        color: #4d6a80;
        font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        pointer-events: none;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <canvas id="overlay"></canvas>
    <div id="hud"></div>
    <div id="keys">
      W/S or ↑/↓ pitch · A/D or ←/→ yaw · Q/E roll · Shift/Ctrl throttle · Space or click fire<br />
      J cruise · T/G target · F face target · X assist · V view · 1/2/3 panel left/forward/right, or chase orbit port/astern/starboard · Alt+←/→ head turn · Z settings
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
