# Format, lint, wiring, typecheck, unit-test, build — and publish to Cloudflare
# Pages on every push to main.
#
# The split from `probes.yml` is deliberate and inherited from seekolous: this
# job is the fast gate every pull request waits on, and the browser probes are
# slow enough that putting them here would train everyone to route around the
# check. What each tier is for is written up in `probes.yml`.
#
# As of #14 this is the **only** gate on a pull request: the probes no longer
# run on GitHub at all, because installing a browser per run cost minutes and
# once hung for twenty-five. They run on a laptop instead — `npm run probe`,
# per `CLAUDE.md`. `probes.yml` records that trade and what it gives up.
#
# NOTE: this is a GitHub Actions deploy, not Cloudflare's own Git integration.
# A Pages project created by direct upload cannot be converted to Git
# integration later — Cloudflare is explicit about that — so driving
# `wrangler pages deploy` from CI is what gets push-to-deploy behaviour without
# committing to a project shape before the project exists.
#
# The deploy step is inert until `CLOUDFLARE_API_TOKEN` is set: it warns and
# skips rather than failing, so the build and typecheck gate works from the
# first commit and the deploy switches on the day the secret lands.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The repo is Biome-formatted (see biome.jsonc at the root; `npm run
      # format` re-applies it). This gate fails the job if a PR drifts.
      - run: npm run format:check

      # Undeclared names in `scripts/`; what it covers and what it cannot see is
      # written in biome.jsonc (#402).
      - run: npm run lint

      # Every script that opens a browser is bound to the launcher it calls
      # (#403). Static — it scans `scripts/` and launches nothing — so it does
      # not reopen #14's reason for keeping the browser tier off GitHub.
      #
      # `npm test` has run this same gate on every pull request since #402, and
      # still does. This step is about the shape of the failure rather than its
      # presence: the job stops on its own step — the runner lists it as
      # `Run npm run check:wiring` — ahead of the unit tier and the build,
      # instead of at the tail of a 2,600-row `bun test` run whose exit code does
      # not name the gate that failed. It is green on `main`, so adding it cannot
      # open every PR red.
      - run: npm run check:wiring

      # The headless tier: seeded generation, the float64 sim, the module
      # boundary that keeps Three.js out of it. Seconds, no browser.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm test

      # #604: the natural voice's files into `public/voice-model/`, which the
      # build copies into `dist`. Only where it deploys: a pull request
      # builds and ships nothing, so it does not fetch 280 MiB to check that.
      # The downloads are kept by checksum, so a cached run fetches nothing;
      # the key moves when the pinned files do.
      - name: Cache the voice model
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .voice-model-cache
          key: voice-model-${{ hashFiles('scripts/lib/voice-model.mjs') }}
      - name: Fetch the voice model
        if: github.event_name != 'pull_request'
        run: node scripts/fetch-voice-model.mjs

      # The music's instrument samples are in Git LFS (map #1's Constraints,
      # 2026-10-06), and the checkout above leaves them as pointer files. Only
      # a publishing run needs the audio, so a pull request spends no LFS
      # bandwidth; git-lfs is preinstalled on GitHub's Ubuntu runners.
      - name: Fetch the music samples
        if: github.event_name != 'pull_request'
        run: git lfs pull --include "public/music-samples/**"

      # `npm run build` is `tsc --noEmit && vite build`, so a type error fails
      # the job before anything is published.
      - run: npm run build

      # Pull requests get the build and typecheck as a gate, but must not
      # publish. Only pushes to main deploy.
      - name: Check deploy credentials
        id: creds
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — deploy skipped."
          fi

      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=seelite --branch=main
