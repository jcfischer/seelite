<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital Metropolis · Seelite</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#020408;color:#e9e4da;font:13px system-ui,sans-serif}canvas{display:block}header{position:absolute;top:28px;left:30px;pointer-events:none}small{font-size:10px;letter-spacing:.22em;color:#b3b0a5}h1{font-size:25px;font-weight:450;letter-spacing:.04em;margin:8px 0}header p{color:#999b9e;font-size:12px;margin:0}aside{position:absolute;bottom:28px;left:30px;width:310px;padding:20px;background:linear-gradient(135deg,#141b22ec,#0d1219db);border:1px solid #56616a66;border-radius:12px;backdrop-filter:blur(16px)}label{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;color:#c7c6c0}input[type=range]{width:100%;accent-color:#d0ae73;margin:0 0 17px}button,input[type=number]{color:inherit;background:#27313b;border:1px solid #535d66;border-radius:6px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#364452}button:disabled{opacity:.4;cursor:default}input[type=number]{width:85px;padding:5px 8px}.row{display:flex;gap:8px;margin-bottom:12px}.row button{flex:1}.sub{font-size:11px;color:#939ca3;line-height:1.6;margin:10px 0 0}#status{position:absolute;bottom:26px;right:30px;font:11px ui-monospace,monospace;color:#98a4ac;text-align:right;line-height:1.8}.capture header,.capture aside,.capture #status{display:none}.badge{position:absolute;top:28px;right:30px;color:#b7a37e;font-size:10px;letter-spacing:.17em}.capture .badge{display:none}@media(max-width:650px){aside{bottom:15px;left:15px;width:255px;padding:14px}header{top:15px;left:15px}h1{font-size:19px}#status{display:none}}
