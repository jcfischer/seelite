<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Seven ships — Exterior studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020405;color:#d5dedc;font:12px system-ui,sans-serif;overflow:hidden}canvas{display:block}header{position:fixed;left:32px;top:28px;pointer-events:none}h1{font-size:28px;font-weight:400;letter-spacing:8px;margin:8px 0}.eyebrow{font-size:10px;color:#c8a36f;letter-spacing:3px}.sub{font-size:11px;color:#819295;letter-spacing:1px}nav{position:fixed;right:32px;top:30px;display:flex;gap:6px}select{background:#11191c;color:#d6dfdc;border:1px solid #344447;padding:8px}button{cursor:pointer;color:#b6c1be;background:#11191ce6;border:1px solid #344447;padding:10px 14px;font:inherit}button:hover,button[aria-pressed=true]{color:#f0cb91;border-color:#bd9b69;background:#263034}footer{position:fixed;bottom:25px;left:32px;right:32px;display:flex;align-items:end;justify-content:space-between}.views{display:flex;gap:5px}.hint{color:#829194;font-size:10px;letter-spacing:1px;margin-top:12px}#readout{font-size:10px;line-height:1.8;letter-spacing:1px;text-align:right;color:#84999a}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#020405;letter-spacing:3px}#target-dialog{border:1px solid #4f6061;background:#080d10;padding:8px;max-width:94vw;max-height:94vh;color:#d6dfdc}#target-dialog::backdrop{background:#000c}#target-dialog img{display:block;max-width:88vw;max-height:82vh}#target-dialog button{display:block;margin-left:auto}body.capture header,body.capture nav,body.capture footer{display:none}@media(max-width:850px){header{left:16px;top:16px}nav{right:16px;top:105px}footer{left:16px;right:16px}.views{flex-wrap:wrap;max-width:330px}#readout{max-width:170px}h1{font-size:23px}}
